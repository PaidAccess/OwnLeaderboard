<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Progress Leaderboard - Track improvements over time">
<title>Progress Board — Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --surface: rgba(15, 15, 15, 0.95);
  --surface-alt: rgba(20, 20, 20, 0.95);
  --card: rgba(10, 10, 10, 0.95);
  --text: #e0e0e0;
  --muted: #666;
  --border: rgba(255, 255, 255, 0.1);
  --border-h: rgba(255, 255, 255, 0.2);
  --accent: #ffffff;
  --accent-s: rgba(255, 255, 255, 0.1);
  --green: #00ff88;
  --green-s: rgba(0, 255, 136, 0.1);
  --red: #ff4444;
  --red-s: rgba(255, 68, 68, 0.1);
  --gold: #ffd700;
  --gold-s: rgba(255, 215, 0, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  min-height: 100vh;
  background: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 1000px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
}

.header {
  text-align: center;
  margin-bottom: 40px;
}

.header h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 3rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}

.header p {
  color: var(--muted);
  font-size: 0.95rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.players-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 30px;
}

.player-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 25px;
  text-align: center;
  transition: all 0.3s ease;
}

.player-card:hover {
  border-color: var(--border-h);
  box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
}

.player-rank-indicator {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid var(--border);
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Rajdhani', sans-serif;
  font-size: 2rem;
  font-weight: 700;
  background: var(--surface-alt);
  color: #ffffff;
}

.player-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 5px;
}

.player-display {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 15px;
}

.player-score {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 5px;
}

.player-score-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.categories-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.category-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}

.category-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.category-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.players-compare {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: start;
}

.player-stat {
  text-align: center;
}

.stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.8rem;
  font-weight: 700;
  color: #ffffff;
}

.stat-history {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 3px;
}

.stat-previous {
  font-size: 0.8rem;
  color: var(--muted);
  text-decoration: line-through;
  opacity: 0.6;
}

.stat-change {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  margin-top: 5px;
  padding: 3px 8px;
  border-radius: 5px;
  display: inline-block;
  line-height: 1.4;
}

.stat-change.positive {
  color: var(--green);
  background: var(--green-s);
}

.stat-change.negative {
  color: var(--red);
  background: var(--red-s);
}

.stat-change.neutral {
  color: var(--muted);
  background: rgba(255, 255, 255, 0.05);
}

.vs-divider {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--muted);
  padding-top: 10px;
}

.overall-comparison {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 25px;
  text-align: center;
  margin-bottom: 20px;
}

.overall-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 20px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.progress-bars {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.progress-item {
  display: flex;
  align-items: center;
  gap: 15px;
}

.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--muted);
  min-width: 100px;
  text-align: right;
}

.progress-bar-container {
  flex: 1;
  height: 30px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 15px;
  overflow: hidden;
  position: relative;
}

.progress-bar {
  height: 100%;
  border-radius: 15px;
  transition: width 1s ease;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
}

.progress-bar.p1 {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.4));
}

.progress-bar.p2 {
  background: linear-gradient(90deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.4));
}

.progress-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 700;
  color: #ffffff;
}

.weekly-delta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  margin-top: 10px;
}

.edit-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 20px;
}

.edit-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 20px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.edit-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.edit-player {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
}

.edit-player-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 15px;
}

.edit-field {
  margin-bottom: 12px;
}

.edit-label {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 5px;
}

.edit-input-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.edit-input {
  flex: 1;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--border);
  color: #ffffff;
  padding: 8px 12px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}

.edit-input:focus {
  border-color: rgba(255, 255, 255, 0.4);
}

.edit-select {
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--border);
  color: #ffffff;
  padding: 8px 12px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  outline: none;
  cursor: pointer;
  min-width: 90px;
}

.edit-select:focus {
  border-color: rgba(255, 255, 255, 0.4);
}

.edit-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  color: #ffffff;
}

.edit-btn.add {
  background: rgba(0, 255, 136, 0.1);
  border-color: rgba(0, 255, 136, 0.3);
}

.edit-btn.add:hover {
  background: rgba(0, 255, 136, 0.2);
}

.edit-btn.subtract {
  background: rgba(255, 68, 68, 0.1);
  border-color: rgba(255, 68, 68, 0.3);
}

.edit-btn.subtract:hover {
  background: rgba(255, 68, 68, 0.2);
}

.update-btn {
  width: 100%;
  padding: 15px;
  background: #ffffff;
  color: #000000;
  border: none;
  border-radius: 10px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s ease;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.update-btn:hover {
  background: #e0e0e0;
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
}

.reset-btn {
  width: 100%;
  padding: 12px;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-top: 10px;
}

.reset-btn:hover {
  border-color: rgba(255, 68, 68, 0.3);
  color: #ff4444;
}

@media (max-width: 768px) {
  .container { padding: 20px; }
  .players-grid { grid-template-columns: 1fr; }
  .categories-grid { grid-template-columns: 1fr; }
  .edit-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 2rem; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>PROGRESS BOARD</h1>
    <p>Track Changes Over Time</p>
  </div>

  <div class="players-grid" id="players-grid"></div>

  <div class="categories-grid" id="categories-grid"></div>

  <div class="overall-comparison">
    <div class="overall-title">Overall Progress</div>
    <div class="progress-bars" id="progress-bars"></div>
  </div>

  <div class="edit-section">
    <div class="edit-title">Edit Stats</div>
    <div class="edit-grid" id="edit-grid"></div>
    <button class="update-btn" id="apply-changes-btn">APPLY CHANGES & DOWNLOAD JSON</button>
    <button class="reset-btn" id="reset-btn">RESET TO ORIGINAL</button>
  </div>
</div>

<script>
const PLAYERS_FILE = 'players.json';

let playersData = [];
let originalData = [];

const PERIODS = ['day', 'week', 'month', 'year'];

function calculateOverall(player) {
  return (player.bounce || 0) + (player.nobounce || 0) + (player.consistency || 0) + (player.cam || 0);
}

function getHistoryText(player, key) {
  if (!player.history || !player.history[key]) return '';
  const h = player.history[key];
  const current = player[key] || 0;
  const previous = h.value || 0;
  const diff = current - previous;
  const period = h.period || 'week';
  
  if (diff === 0) return `<span style="color:var(--muted)">No change</span>`;
  
  const changeText = diff > 0 ? `+${diff} better` : `${diff} worse`;
  return `<span style="color:${diff > 0 ? 'var(--green)' : 'var(--red)'};font-weight:600">${changeText} than ${period} ago</span>`;
}

function renderPlayerCard(player, index) {
  const overall = calculateOverall(player);
  
  return `
    <div class="player-card">
      <div class="player-rank-indicator">#${index + 1}</div>
      <div class="player-name">@${player.name}</div>
      <div class="player-display">${player.display || player.name}</div>
      <div class="player-score">${overall}</div>
      <div class="player-score-label">Total Score / 400</div>
    </div>
  `;
}

function renderCategoryComparison(category, key) {
  if (playersData.length < 2) return '';
  
  const p1 = playersData[0];
  const p2 = playersData[1];
  
  return `
    <div class="category-card">
      <div class="category-header">
        <span class="category-name">${category}</span>
        <span style="font-size:0.8rem;color:var(--muted)">/ 100</span>
      </div>
      <div class="players-compare">
        <div class="player-stat">
          <div class="stat-value">${p1[key] || 0}</div>
          <div class="stat-history">${getHistoryText(p1, key)}</div>
          ${p1.history?.[key] ? `<div class="stat-previous">Was ${p1.history[key].value}</div>` : ''}
        </div>
        <div class="vs-divider">VS</div>
        <div class="player-stat">
          <div class="stat-value">${p2[key] || 0}</div>
          <div class="stat-history">${getHistoryText(p2, key)}</div>
          ${p2.history?.[key] ? `<div class="stat-previous">Was ${p2.history[key].value}</div>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderProgressBars() {
  if (playersData.length < 2) return '';
  
  const p1 = playersData[0];
  const p2 = playersData[1];
  const p1Overall = calculateOverall(p1);
  const p2Overall = calculateOverall(p2);
  const maxScore = 400;
  
  const p1Percent = Math.min(100, (p1Overall / maxScore) * 100);
  const p2Percent = Math.min(100, (p2Overall / maxScore) * 100);
  
  return `
    <div class="progress-item">
      <div class="progress-label">${p1.name}</div>
      <div class="progress-bar-container">
        <div class="progress-bar p1" style="width:${p1Percent}%">
          <span class="progress-value">${p1Overall}/400</span>
        </div>
      </div>
    </div>
    <div class="progress-item">
      <div class="progress-label">${p2.name}</div>
      <div class="progress-bar-container">
        <div class="progress-bar p2" style="width:${p2Percent}%">
          <span class="progress-value">${p2Overall}/400</span>
        </div>
      </div>
    </div>
  `;
}

function renderEditSection() {
  const categories = [
    { name: 'Bounce', key: 'bounce' },
    { name: 'No Bounce', key: 'nobounce' },
    { name: 'Consistency', key: 'consistency' },
    { name: 'Camera', key: 'cam' }
  ];
  
  document.getElementById('edit-grid').innerHTML = playersData.map((player, pIndex) => `
    <div class="edit-player">
      <div class="edit-player-name">${player.name}</div>
      ${categories.map(cat => {
        const history = player.history?.[cat.key] || {};
        return `
          <div class="edit-field">
            <div class="edit-label">${cat.name}: ${player[cat.key]}</div>
            <div class="edit-input-group">
              <button class="edit-btn subtract" onclick="adjustStat(${pIndex}, '${cat.key}', -5)">-5</button>
              <button class="edit-btn subtract" onclick="adjustStat(${pIndex}, '${cat.key}', -1)">-1</button>
              <input class="edit-input" type="number" value="${player[cat.key]}" min="0" max="100" 
                     onchange="setStat(${pIndex}, '${cat.key}', parseInt(this.value))" id="input-${pIndex}-${cat.key}">
              <button class="edit-btn add" onclick="adjustStat(${pIndex}, '${cat.key}', 1)">+1</button>
              <button class="edit-btn add" onclick="adjustStat(${pIndex}, '${cat.key}', 5)">+5</button>
            </div>
            <div style="display:flex;gap:8px;margin-top:6px;align-items:center;">
              <span style="font-size:0.7rem;color:var(--muted);">Compare to:</span>
              <input type="number" value="${history.value || player[cat.key]}" 
                     style="width:60px;background:rgba(0,0,0,0.5);border:1px solid var(--border);color:#fff;padding:4px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:0.75rem;"
                     onchange="setHistoryValue(${pIndex}, '${cat.key}', parseInt(this.value))" 
                     id="hist-val-${pIndex}-${cat.key}">
              <select class="edit-select" onchange="setHistoryPeriod(${pIndex}, '${cat.key}', this.value)" id="hist-period-${pIndex}-${cat.key}">
                ${PERIODS.map(p => `<option value="${p}" ${(history.period || 'week') === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
              <span style="font-size:0.7rem;color:var(--muted);">ago</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
}

function adjustStat(playerIndex, key, delta) {
  const current = playersData[playerIndex][key] || 0;
  const newVal = Math.max(0, Math.min(100, current + delta));
  playersData[playerIndex][key] = newVal;
  document.getElementById(`input-${playerIndex}-${key}`).value = newVal;
  renderAll();
}

function setStat(playerIndex, key, value) {
  if (isNaN(value)) return;
  const clamped = Math.max(0, Math.min(100, value));
  playersData[playerIndex][key] = clamped;
  renderAll();
}

function setHistoryValue(playerIndex, key, value) {
  if (isNaN(value)) return;
  if (!playersData[playerIndex].history) playersData[playerIndex].history = {};
  if (!playersData[playerIndex].history[key]) playersData[playerIndex].history[key] = {};
  playersData[playerIndex].history[key].value = value;
  playersData[playerIndex].history[key].date = new Date().toISOString().split('T')[0];
  renderAll();
}

function setHistoryPeriod(playerIndex, key, period) {
  if (!playersData[playerIndex].history) playersData[playerIndex].history = {};
  if (!playersData[playerIndex].history[key]) playersData[playerIndex].history[key] = {};
  playersData[playerIndex].history[key].period = period;
  renderAll();
}

function renderAll() {
  playersData.sort((a, b) => calculateOverall(b) - calculateOverall(a));
  
  document.getElementById('players-grid').innerHTML = playersData.map((p, i) => renderPlayerCard(p, i)).join('');
  
  const categories = [
    { name: 'Bounce', key: 'bounce' },
    { name: 'No Bounce', key: 'nobounce' },
    { name: 'Consistency', key: 'consistency' },
    { name: 'Camera', key: 'cam' }
  ];
  
  document.getElementById('categories-grid').innerHTML = categories
    .map(c => renderCategoryComparison(c.name, c.key))
    .join('');
  
  document.getElementById('progress-bars').innerHTML = renderProgressBars();
  renderEditSection();
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(playersData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'players.json';
  a.click();
  URL.revokeObjectURL(url);
}

function resetData() {
  playersData = JSON.parse(JSON.stringify(originalData));
  renderAll();
}

async function init() {
  try {
    const response = await fetch(PLAYERS_FILE, { cache: 'no-store' });
    playersData = await response.json();
    originalData = JSON.parse(JSON.stringify(playersData));
    
    renderAll();
    
    document.getElementById('apply-changes-btn').addEventListener('click', () => {
      downloadJSON();
      alert('Changes saved! Replace your players.json with the downloaded file.');
    });
    
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm('Reset all stats to original values?')) {
        resetData();
      }
    });
    
  } catch (err) {
    console.error('Error loading data:', err);
    document.getElementById('players-grid').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">
        <p>Create a players.json file to get started</p>
      </div>
    `;
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
