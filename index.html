<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Progress Leaderboard">
<title>Progress Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --surface: rgba(15, 15, 15, 0.95);
  --card: rgba(10, 10, 10, 0.95);
  --text: #e0e0e0;
  --muted: #666;
  --border: rgba(255, 255, 255, 0.1);
  --green: #00ff88;
  --green-s: rgba(0, 255, 136, 0.1);
  --red: #ff4444;
  --red-s: rgba(255, 68, 68, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  min-height: 100vh;
  background: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 900px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
}

.header {
  text-align: center;
  margin-bottom: 40px;
}

.header h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 3rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.05em;
}

.header p {
  color: var(--muted);
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 6px;
}

.players-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 30px;
}

.player-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 25px;
}

.player-block.top {
  border-color: rgba(255, 215, 0, 0.4);
}

.player-header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--border);
}

.player-avatar {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  border: 2px solid var(--border);
  object-fit: cover;
  flex-shrink: 0;
  background: var(--card);
}

.player-block.top .player-avatar {
  border-color: rgba(255, 215, 0, 0.5);
}

.player-info {
  flex: 1;
  min-width: 0;
}

.player-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.2;
}

.player-display {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 2px;
}

.player-rank {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: #ffd700;
}

.player-block:not(.top) .player-rank {
  color: #c0c0c0;
}

.player-total {
  text-align: center;
  margin-bottom: 18px;
}

.total-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2.2rem;
  font-weight: 700;
  color: #ffffff;
}

.total-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.period-tag {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
  margin-top: 6px;
}

.stat-rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.stat-name {
  font-size: 0.8rem;
  font-weight: 700;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.stat-right {
  text-align: right;
}

.stat-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.2rem;
  font-weight: 700;
  color: #ffffff;
}

.stat-was {
  font-size: 0.65rem;
  color: var(--muted);
  text-decoration: line-through;
  margin-right: 4px;
}

.stat-diff {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 700;
  display: inline-block;
  margin-top: 2px;
}

.stat-diff.up {
  color: var(--green);
  background: var(--green-s);
}

.stat-diff.down {
  color: var(--red);
  background: var(--red-s);
}

.stat-diff.same {
  color: var(--muted);
  background: rgba(255, 255, 255, 0.05);
}

.bars-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 25px;
}

.bars-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: #ffffff;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 20px;
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
}

.bar-row:last-child { margin-bottom: 0; }

.bar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted);
  min-width: 90px;
  text-align: right;
}

.bar-track {
  flex: 1;
  height: 28px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 14px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
  transition: width 0.8s ease;
}

.bar-fill.p1 { background: rgba(255, 255, 255, 0.3); }
.bar-fill.p2 { background: rgba(255, 215, 0, 0.3); }

.bar-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  font-weight: 700;
  color: #ffffff;
}

@media (max-width: 768px) {
  .container { padding: 20px; }
  .players-row { grid-template-columns: 1fr; }
  .header h1 { font-size: 2rem; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>PROGRESS BOARD</h1>
    <p>Weekly Progress Tracker</p>
  </div>

  <div class="players-row" id="players-row"></div>

  <div class="bars-section">
    <div class="bars-title">Overall Progress</div>
    <div id="bars-container"></div>
  </div>
</div>

<script>
const STATS = [
  { key: 'bounce', name: 'Bounce' },
  { key: 'nobounce', name: 'No Bounce' },
  { key: 'consistency', name: 'Consistency' },
  { key: 'cam', name: 'Camera' }
];

let players = [];
const avatarCache = {};

function total(p) {
  return (p.bounce || 0) + (p.nobounce || 0) + (p.consistency || 0) + (p.cam || 0);
}

function diff(player, stat) {
  const now = player[stat] || 0;
  const prev = player['prev_' + stat] !== undefined ? player['prev_' + stat] : now;
  return now - prev;
}

function diffHTML(player, stat) {
  const d = diff(player, stat);
  const period = player.period || 'week';
  if (d === 0) return '<span class="stat-diff same">No change</span>';
  const cls = d > 0 ? 'up' : 'down';
  const sign = d > 0 ? '+' : '';
  return `<span class="stat-diff ${cls}">${sign}${d} vs ${period} ago</span>`;
}

async function loadAvatars() {
  const ids = players.map(p => p.id).filter(id => !avatarCache[id]);
  if (ids.length === 0) return;
  try {
    const res = await fetch(`https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${ids.join(',')}&size=150x150&format=Png&isCircular=true`);
    const data = await res.json();
    if (data.data) {
      data.data.forEach(x => { avatarCache[x.targetId] = x.imageUrl; });
    }
  } catch (e) {}
}

function getAvatar(id) {
  return avatarCache[id] || '';
}

function renderPlayerBlock(p, index) {
  const t = total(p);
  return `
    <div class="player-block${index === 0 ? ' top' : ''}">
      <div class="player-header">
        <img class="player-avatar" src="${getAvatar(p.id)}" alt="${p.name}" onerror="this.style.display='none'">
        <div class="player-info">
          <div class="player-name">@${p.name}</div>
          <div class="player-display">${p.display || p.name}</div>
        </div>
        <div class="player-rank">#${index + 1}</div>
      </div>
      <div class="player-total">
        <div class="total-num">${t}</div>
        <div class="total-label">Total Score / 400</div>
        <div class="period-tag">${p.period || 'week'}</div>
      </div>
      <div class="stat-rows">
        ${STATS.map(s => {
          const val = p[s.key] || 0;
          const prevVal = p['prev_' + s.key] !== undefined ? p['prev_' + s.key] : val;
          return `
            <div class="stat-row">
              <span class="stat-name">${s.name}</span>
              <div class="stat-right">
                <div>
                  <span class="stat-was">${prevVal}</span>
                  <span class="stat-val">${val}</span>
                </div>
                ${diffHTML(p, s.key)}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function render() {
  players.sort((a, b) => total(b) - total(a));

  document.getElementById('players-row').innerHTML = players.map((p, i) => renderPlayerBlock(p, i)).join('');

  document.getElementById('bars-container').innerHTML = players.map((p, i) => {
    const t = total(p);
    const pct = Math.min(100, (t / 400) * 100);
    return `
      <div class="bar-row">
        <div class="bar-label">${p.name}</div>
        <div class="bar-track">
          <div class="bar-fill p${i + 1}" style="width:${pct}%">
            <span class="bar-val">${t}/400</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function init() {
  try {
    const res = await fetch('players.json', { cache: 'no-store' });
    players = await res.json();
    await loadAvatars();
    render();
  } catch (err) {
    document.getElementById('players-row').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">
        <p>players.json not found</p>
      </div>
    `;
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
