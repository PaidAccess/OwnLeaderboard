<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Progress Leaderboard - Track improvements over time">
<title>Progress Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --surface: rgba(15, 15, 15, 0.95);
  --card: rgba(10, 10, 10, 0.95);
  --text: #e0e0e0;
  --muted: #666;
  --border: rgba(255, 255, 255, 0.1);
  --border-h: rgba(255, 255, 255, 0.2);
  --green: #00ff88;
  --green-s: rgba(0, 255, 136, 0.1);
  --red: #ff4444;
  --red-s: rgba(255, 68, 68, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  min-height: 100vh;
  background: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 900px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
}

.header {
  text-align: center;
  margin-bottom: 40px;
}

.header h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 3rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.05em;
}

.header p {
  color: var(--muted);
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 6px;
}

.players-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 30px;
}

.player-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 30px;
  text-align: center;
  transition: border-color 0.3s;
}

.player-card:hover {
  border-color: var(--border-h);
}

.player-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid var(--border);
  margin: 0 auto 15px;
  display: block;
  object-fit: cover;
  background: var(--card);
}

.player-card:nth-child(1) .player-avatar {
  border-color: rgba(255, 215, 0, 0.5);
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
}

.player-card:nth-child(2) .player-avatar {
  border-color: rgba(192, 192, 192, 0.5);
  box-shadow: 0 0 20px rgba(192, 192, 192, 0.2);
}

.player-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 3px;
}

.player-display {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 15px;
}

.player-total {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2.5rem;
  font-weight: 700;
  color: #ffffff;
}

.player-total-label {
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.period-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
  margin-top: 12px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}

.stat-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}

.stat-compare {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: start;
}

.stat-player {
  text-align: center;
}

.stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.8rem;
  font-weight: 700;
  color: #ffffff;
}

.stat-was {
  font-size: 0.7rem;
  color: var(--muted);
  text-decoration: line-through;
  margin-top: 2px;
}

.stat-diff {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  margin-top: 6px;
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-block;
  font-weight: 700;
}

.stat-diff.up {
  color: var(--green);
  background: var(--green-s);
}

.stat-diff.down {
  color: var(--red);
  background: var(--red-s);
}

.stat-diff.same {
  color: var(--muted);
  background: rgba(255, 255, 255, 0.05);
}

.stat-vs {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--muted);
  padding-top: 15px;
}

.bars-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 25px;
}

.bars-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: #ffffff;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 20px;
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
}

.bar-row:last-child {
  margin-bottom: 0;
}

.bar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted);
  min-width: 90px;
  text-align: right;
}

.bar-track {
  flex: 1;
  height: 28px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 14px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
  transition: width 0.8s ease;
}

.bar-fill.p1 {
  background: rgba(255, 255, 255, 0.3);
}

.bar-fill.p2 {
  background: rgba(255, 215, 0, 0.3);
}

.bar-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  font-weight: 700;
  color: #ffffff;
}

@media (max-width: 768px) {
  .container { padding: 20px; }
  .players-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 2rem; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>PROGRESS BOARD</h1>
    <p>Weekly Progress Tracker</p>
  </div>

  <div class="players-grid" id="players-grid"></div>

  <div class="stats-grid" id="stats-grid"></div>

  <div class="bars-section">
    <div class="bars-title">Overall Progress</div>
    <div id="bars-container"></div>
  </div>
</div>

<script>
const STATS = [
  { key: 'bounce', name: 'Bounce' },
  { key: 'nobounce', name: 'No Bounce' },
  { key: 'consistency', name: 'Consistency' },
  { key: 'cam', name: 'Camera' }
];

let players = [];
const avatarCache = {};

function total(p) {
  return (p.bounce || 0) + (p.nobounce || 0) + (p.consistency || 0) + (p.cam || 0);
}

function diff(player, stat) {
  const now = player[stat] || 0;
  const prev = player['prev_' + stat] !== undefined ? player['prev_' + stat] : now;
  return now - prev;
}

function diffHTML(player, stat) {
  const d = diff(player, stat);
  const period = player.period || 'week';
  
  if (d === 0) {
    return '<span class="stat-diff same">No change</span>';
  }
  
  const cls = d > 0 ? 'up' : 'down';
  const sign = d > 0 ? '+' : '';
  return `<span class="stat-diff ${cls}">${sign}${d} than ${period} ago</span>`;
}

async function loadAvatars() {
  const ids = players.map(p => p.id).filter(id => !avatarCache[id]);
  if (ids.length === 0) return;
  
  try {
    const res = await fetch(`https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${ids.join(',')}&size=150x150&format=Png&isCircular=true`);
    const data = await res.json();
    if (data.data) {
      data.data.forEach(x => {
        avatarCache[x.targetId] = x.imageUrl;
      });
    }
  } catch (e) {
    console.log('Avatar load failed');
  }
}

function getAvatar(id) {
  return avatarCache[id] || '';
}

function render() {
  players.sort((a, b) => total(b) - total(a));

  // Player cards
  document.getElementById('players-grid').innerHTML = players.map((p, i) => `
    <div class="player-card">
      <img class="player-avatar" src="${getAvatar(p.id)}" alt="${p.name}" onerror="this.style.display='none'">
      <div class="player-name">@${p.name}</div>
      <div class="player-display">${p.display || p.name}</div>
      <div class="player-total">${total(p)}</div>
      <div class="player-total-label">/ 400</div>
      <div class="period-badge">${p.period || 'week'}</div>
    </div>
  `).join('');

  // Stat cards
  document.getElementById('stats-grid').innerHTML = STATS.map(s => {
    if (players.length < 2) return '';
    const a = players[0];
    const b = players[1];
    return `
      <div class="stat-card">
        <div class="stat-title">${s.name}</div>
        <div class="stat-compare">
          <div class="stat-player">
            <div class="stat-value">${a[s.key] || 0}</div>
            <div class="stat-was">Was ${a['prev_' + s.key] !== undefined ? a['prev_' + s.key] : a[s.key]}</div>
            ${diffHTML(a, s.key)}
          </div>
          <div class="stat-vs">VS</div>
          <div class="stat-player">
            <div class="stat-value">${b[s.key] || 0}</div>
            <div class="stat-was">Was ${b['prev_' + s.key] !== undefined ? b['prev_' + s.key] : b[s.key]}</div>
            ${diffHTML(b, s.key)}
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Progress bars
  document.getElementById('bars-container').innerHTML = players.map((p, i) => {
    const t = total(p);
    const pct = Math.min(100, (t / 400) * 100);
    return `
      <div class="bar-row">
        <div class="bar-label">${p.name}</div>
        <div class="bar-track">
          <div class="bar-fill p${i + 1}" style="width:${pct}%">
            <span class="bar-val">${t}/400</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function init() {
  try {
    const res = await fetch('players.json', { cache: 'no-store' });
    players = await res.json();
    await loadAvatars();
    render();
  } catch (err) {
    document.getElementById('players-grid').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">
        <p>players.json not found</p>
      </div>
    `;
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
