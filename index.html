<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Progress Leaderboard - Track improvements over time">
<title>Progress Board — Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --surface: rgba(15, 15, 15, 0.95);
  --surface-alt: rgba(20, 20, 20, 0.95);
  --card: rgba(10, 10, 10, 0.95);
  --text: #e0e0e0;
  --muted: #666;
  --border: rgba(255, 255, 255, 0.1);
  --border-h: rgba(255, 255, 255, 0.2);
  --accent: #ffffff;
  --green: #00ff88;
  --green-s: rgba(0, 255, 136, 0.1);
  --red: #ff4444;
  --red-s: rgba(255, 68, 68, 0.1);
  --gold: #ffd700;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  min-height: 100vh;
  background: #000000;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
}

.header {
  text-align: center;
  margin-bottom: 40px;
}

.header h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 3rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}

.header p {
  color: var(--muted);
  font-size: 0.95rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.players-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 30px;
}

.player-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 25px;
  text-align: center;
  transition: all 0.3s ease;
}

.player-card:hover {
  border-color: var(--border-h);
  box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
}

.player-rank {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 2px solid var(--border);
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  background: var(--surface-alt);
  color: #ffffff;
}

.player-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 5px;
}

.player-display {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 15px;
}

.player-score {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 5px;
}

.player-score-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.period-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
  margin-top: 10px;
}

.categories-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.category-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}

.category-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.category-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.players-compare {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 15px;
  align-items: start;
}

.player-stat {
  text-align: center;
}

.stat-current {
  font-family: 'JetBrains Mono', monospace;
  font-size: 2rem;
  font-weight: 700;
  color: #ffffff;
}

.stat-previous {
  font-size: 0.75rem;
  color: var(--muted);
  text-decoration: line-through;
  margin-top: 2px;
}

.stat-change {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  margin-top: 6px;
  padding: 4px 10px;
  border-radius: 5px;
  display: inline-block;
  font-weight: 700;
}

.stat-change.better {
  color: var(--green);
  background: var(--green-s);
}

.stat-change.worse {
  color: var(--red);
  background: var(--red-s);
}

.stat-change.same {
  color: var(--muted);
  background: rgba(255, 255, 255, 0.05);
}

.vs-divider {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--muted);
  padding-top: 20px;
}

.overall-comparison {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 20px;
}

.overall-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 20px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-align: center;
}

.progress-bars {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.progress-item {
  display: flex;
  align-items: center;
  gap: 15px;
}

.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--muted);
  min-width: 100px;
  text-align: right;
}

.progress-bar-container {
  flex: 1;
  height: 30px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 15px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  border-radius: 15px;
  transition: width 0.8s ease;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
}

.progress-bar.p1 {
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.5));
}

.progress-bar.p2 {
  background: linear-gradient(90deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.5));
}

.progress-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 700;
  color: #ffffff;
}

.edit-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 25px;
}

.edit-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 20px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.edit-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.edit-player {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
}

.edit-player-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 15px;
}

.edit-field {
  margin-bottom: 10px;
}

.edit-label {
  display: block;
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}

.edit-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.edit-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.15s;
  color: #ffffff;
  background: rgba(255, 255, 255, 0.05);
}

.edit-btn.add {
  border-color: rgba(0, 255, 136, 0.3);
  color: var(--green);
}

.edit-btn.add:hover {
  background: rgba(0, 255, 136, 0.15);
}

.edit-btn.sub {
  border-color: rgba(255, 68, 68, 0.3);
  color: var(--red);
}

.edit-btn.sub:hover {
  background: rgba(255, 68, 68, 0.15);
}

.edit-input {
  width: 55px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--border);
  color: #ffffff;
  padding: 6px 8px;
  border-radius: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  text-align: center;
  outline: none;
}

.edit-input:focus {
  border-color: rgba(255, 255, 255, 0.4);
}

.edit-select {
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--border);
  color: #ffffff;
  padding: 6px 8px;
  border-radius: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  outline: none;
  cursor: pointer;
}

.apply-btn {
  width: 100%;
  padding: 14px;
  background: #ffffff;
  color: #000000;
  border: none;
  border-radius: 10px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.apply-btn:hover {
  background: #e0e0e0;
}

@media (max-width: 768px) {
  .container { padding: 20px; }
  .players-grid { grid-template-columns: 1fr; }
  .categories-grid { grid-template-columns: 1fr; }
  .edit-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 2rem; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>PROGRESS BOARD</h1>
    <p>Track Changes Over Time</p>
  </div>

  <div class="players-grid" id="players-grid"></div>

  <div class="categories-grid" id="categories-grid"></div>

  <div class="overall-comparison">
    <div class="overall-title">Overall Progress</div>
    <div class="progress-bars" id="progress-bars"></div>
  </div>

  <div class="edit-section">
    <div class="edit-title">Quick Edit</div>
    <div class="edit-grid" id="edit-grid"></div>
    <button class="apply-btn" id="download-btn">DOWNLOAD UPDATED JSON</button>
  </div>
</div>

<script>
let playersData = [];
const PERIODS = ['day', 'week', 'month', 'year'];
const STATS = ['bounce', 'nobounce', 'consistency', 'cam'];
const STAT_NAMES = ['Bounce', 'No Bounce', 'Consistency', 'Camera'];

function calcTotal(p) {
  return (p.bounce || 0) + (p.nobounce || 0) + (p.consistency || 0) + (p.cam || 0);
}

function getDiff(player, stat) {
  const prevKey = 'prev_' + stat;
  const current = player[stat] || 0;
  const previous = player[prevKey] !== undefined ? player[prevKey] : current;
  return current - previous;
}

function getChangeHTML(player, stat) {
  const diff = getDiff(player, stat);
  const period = player.period || 'week';
  
  if (diff === 0) {
    return '<span class="stat-change same">No change</span>';
  }
  
  const cls = diff > 0 ? 'better' : 'worse';
  const sign = diff > 0 ? '+' : '';
  return `<span class="stat-change ${cls}">${sign}${diff} than ${period} ago</span>`;
}

function renderAll() {
  // Sort by total
  playersData.sort((a, b) => calcTotal(b) - calcTotal(a));
  
  // Player cards
  document.getElementById('players-grid').innerHTML = playersData.map((p, i) => {
    const total = calcTotal(p);
    return `
      <div class="player-card">
        <div class="player-rank">#${i + 1}</div>
        <div class="player-name">@${p.name}</div>
        <div class="player-display">${p.display || p.name}</div>
        <div class="player-score">${total}</div>
        <div class="player-score-label">Total Score / 400</div>
        <div class="period-badge">${p.period || 'week'}</div>
      </div>
    `;
  }).join('');
  
  // Category comparisons
  document.getElementById('categories-grid').innerHTML = STATS.map((stat, idx) => {
    if (playersData.length < 2) return '';
    const p1 = playersData[0];
    const p2 = playersData[1];
    
    return `
      <div class="category-card">
        <div class="category-header">
          <span class="category-name">${STAT_NAMES[idx]}</span>
          <span style="font-size:0.7rem;color:var(--muted)">/ 100</span>
        </div>
        <div class="players-compare">
          <div class="player-stat">
            <div class="stat-current">${p1[stat] || 0}</div>
            <div class="stat-previous">Was ${p1['prev_' + stat] !== undefined ? p1['prev_' + stat] : p1[stat]}</div>
            ${getChangeHTML(p1, stat)}
          </div>
          <div class="vs-divider">VS</div>
          <div class="player-stat">
            <div class="stat-current">${p2[stat] || 0}</div>
            <div class="stat-previous">Was ${p2['prev_' + stat] !== undefined ? p2['prev_' + stat] : p2[stat]}</div>
            ${getChangeHTML(p2, stat)}
          </div>
        </div>
      </div>
    `;
  }).join('');
  
  // Progress bars
  document.getElementById('progress-bars').innerHTML = playersData.map((p, i) => {
    const total = calcTotal(p);
    const pct = Math.min(100, (total / 400) * 100);
    return `
      <div class="progress-item">
        <div class="progress-label">${p.name}</div>
        <div class="progress-bar-container">
          <div class="progress-bar p${i + 1}" style="width:${pct}%">
            <span class="progress-value">${total}/400</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
  
  // Edit section
  document.getElementById('edit-grid').innerHTML = playersData.map((p, pIdx) => `
    <div class="edit-player">
      <div class="edit-player-name">${p.name}</div>
      ${STATS.map((stat, sIdx) => `
        <div class="edit-field">
          <div class="edit-label">${STAT_NAMES[sIdx]}: <strong>${p[stat] || 0}</strong> (was ${p['prev_' + stat] !== undefined ? p['prev_' + stat] : '?'})</div>
          <div class="edit-row">
            <button class="edit-btn sub" onclick="changeStat(${pIdx}, '${stat}', -5)">-5</button>
            <button class="edit-btn sub" onclick="changeStat(${pIdx}, '${stat}', -1)">-1</button>
            <input class="edit-input" type="number" value="${p[stat] || 0}" min="0" max="100" 
                   onchange="setStat(${pIdx}, '${stat}', this.value)" id="inp-${pIdx}-${stat}">
            <button class="edit-btn add" onclick="changeStat(${pIdx}, '${stat}', 1)">+1</button>
            <button class="edit-btn add" onclick="changeStat(${pIdx}, '${stat}', 5)">+5</button>
          </div>
        </div>
      `).join('')}
      <div style="margin-top:15px;padding-top:15px;border-top:1px solid var(--border);">
        <div class="edit-label">Time Period</div>
        <select class="edit-select" onchange="setPeriod(${pIdx}, this.value)" style="width:100%;">
          ${PERIODS.map(per => `<option value="${per}" ${(p.period || 'week') === per ? 'selected' : ''}>${per}</option>`).join('')}
        </select>
        <div class="edit-label" style="margin-top:10px;">Previous Values</div>
        ${STATS.map((stat, sIdx) => `
          <div class="edit-row" style="margin-top:4px;">
            <span style="font-size:0.7rem;color:var(--muted);min-width:80px;">${STAT_NAMES[sIdx]}:</span>
            <input class="edit-input" type="number" value="${p['prev_' + stat] !== undefined ? p['prev_' + stat] : p[stat]}" min="0" max="100"
                   onchange="setPrev(${pIdx}, '${stat}', this.value)" id="prev-${pIdx}-${stat}">
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function changeStat(pIdx, stat, delta) {
  const cur = playersData[pIdx][stat] || 0;
  const newVal = Math.max(0, Math.min(100, cur + delta));
  playersData[pIdx][stat] = newVal;
  document.getElementById(`inp-${pIdx}-${stat}`).value = newVal;
  renderAll();
}

function setStat(pIdx, stat, val) {
  val = parseInt(val);
  if (isNaN(val)) return;
  playersData[pIdx][stat] = Math.max(0, Math.min(100, val));
  renderAll();
}

function setPrev(pIdx, stat, val) {
  val = parseInt(val);
  if (isNaN(val)) return;
  playersData[pIdx]['prev_' + stat] = Math.max(0, Math.min(100, val));
  renderAll();
}

function setPeriod(pIdx, period) {
  playersData[pIdx].period = period;
  renderAll();
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(playersData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'players.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function init() {
  try {
    const res = await fetch('players.json', { cache: 'no-store' });
    playersData = await res.json();
    renderAll();
    document.getElementById('download-btn').onclick = downloadJSON;
  } catch (err) {
    document.getElementById('players-grid').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">
        <p>Create a players.json file to get started</p>
      </div>
    `;
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
